schema_version: 1

blocks:
  vad:
    kind: vad
    backend: silero
    settings:
      # Generous end-of-speech pause for learners: 1.2 s of silence.
      min_silence_ms: 1200
      min_speech_ms: 384
      speech_pad_ms: 500
      thresh: 0.5
  stt:
    kind: stt
    backend: parakeet-tdt
    settings:
      parakeet_tdt_model_name: mlx-community/parakeet-tdt-0.6b-v3
      parakeet_tdt_device: mps
  llm:
    kind: llm
    backend: chat-completions
    settings:
      model_name: deepseek-flash
      responses_api_base_url: {env: DEEPSEEK_BASE_URL}
      responses_api_api_key: {env: DEEPSEEK_API_KEY}
      responses_api_stream: true
      # DeepSeek accepts reasoning_effort=none and then skips thinking tokens.
      responses_api_reasoning_effort: none
      responses_api_disable_thinking: false
      init_chat_prompt: {env: TUTOR_PROMPT}
      chat_size: 20
      compact_history: false
      stream_batch_sentences: 1
  tts:
    kind: tts
    backend: qwen3
    settings:
      qwen3_tts_speaker: Aiden
      qwen3_tts_language: english
      qwen3_tts_mlx_quantization: 6bit
      qwen3_tts_streaming_chunk_size: 8

pipelines:
  english-tutor:
    options:
      mac_optimal_settings: true
    stages:
      vad: vad
      stt: stt
      llm: llm
      tts: tts

runtime:
  log_level: info
  server:
    host: 127.0.0.1
    port: 8765
  client:
    verbose: false
    # On speakers this prevents the agent from hearing and answering itself.
    # Set false when using headphones to keep voice barge-in.
    block_mic_during_playback: true
    playback_buffer_ms: 250
